[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphlore"
version = "0.7.0"
description = "MCP server that lets AI coding assistants navigate a codebase through a knowledge graph it builds itself (Rust and tree-sitter, 14 languages): semantic code search, impact analysis, token-budgeted subgraphs and exact source spans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yasinyaman" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "graphlore", "graphify",
    "knowledge-graph", "code-graph", "codebase", "code-navigation", "code-search",
    "semantic-search", "impact-analysis", "static-analysis", "tree-sitter",
    "ai", "llm", "ai-agents", "coding-assistant", "claude", "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    # Floor is the tested baseline (mcp 2.1, the v2 SDK). This server uses the
    # v2 API surface: `mcp.server.mcpserver.MCPServer` (with per-call HTTP
    # transport options: `run(host=..., port=...)` / `streamable_http_app(host=...)`),
    # tool annotations, and host-LLM sampling (`check_client_capability` /
    # `create_message`). The in-memory `Client(server)` used by the test suite is
    # also v2-only. Upper bound guards against a breaking 3.0 release.
    "mcp>=2.1,<3.0",
]

[project.optional-dependencies]
# graphlore's own extractor (engine/, Rust): prebuilt abi3 wheels for Linux,
# macOS and Windows, so no Rust toolchain enters graphlore's install. With it the
# default GRAPHLORE_ENGINE=auto builds natively; graphify is the fallback.
engine = ["graphlore-engine>=0.5.79,<0.6"]
# Deprecated: the graphify CLI, the fallback extractor until the next release.
graphify = ["graphifyy"]
semble = ["semble>=0.3"]
# The dense tier of the built-in search (GRAPHLORE_SEMANTIC_BACKEND unset or
# builtin): static code embeddings, fused with its always-on BM25 tier. The first
# use downloads the model (minishlab/potion-code-16M-v2) from the Hugging Face Hub.
embed = ["model2vec>=0.10", "numpy>=1.24"]
# Multi-language span/structure backend for graphify_locate and graphify_freshness
# (Python works without it via stdlib ast; without it the native engine gives the spans).
# Bounds: the floors are the oldest pair the suite passes with (Python 3.10,
# mcp 2.1). Language-pack 1.9 and 1.10 hand back a Language that
# `tree_sitter.Parser` rejects, and 1.11 needs tree-sitter >= 0.23. Both stay below
# the next major: the pack bundles grammars that churn, and the golden span tests
# should not regress silently on a grammar update.
treesitter = ["tree-sitter>=0.23,<1.0", "tree-sitter-language-pack>=1.11,<2.0"]
# Exact token counting for the budgeted subgraph tools (opt-in via
# GRAPHIFY_TOKENIZER=tiktoken); without it the conservative chars/3.5 estimate is used.
tiktoken = ["tiktoken>=0.7"]
# Opt-in filesystem watcher (GRAPHIFY_WATCH=1) that re-syncs the graph on structural
# source changes. Off by default so the stdio server stays light.
watch = ["watchdog>=4.0"]
all = [
    "graphlore-engine>=0.5.79,<0.6", "graphifyy", "semble>=0.3", "model2vec>=0.10", "numpy>=1.24",
    "tree-sitter>=0.23,<1.0", "tree-sitter-language-pack>=1.11,<2.0",
    "tiktoken>=0.7", "watchdog>=4.0", "pyjwt[crypto]>=2.8",
]
# OAuth for the HTTP transport (GRAPHLORE_AUTH_ISSUER): verifying the provider's
# signed tokens (oauth.py). Not needed for stdio or the static GRAPHLORE_API_KEY.
remote = ["pyjwt[crypto]>=2.8"]
# mypy 1.11 crashes reading mcp's own sources; 1.12 is the oldest that checks the package.
dev = ["pytest>=8.0", "ruff>=0.6", "pytest-cov>=5.0", "mypy>=1.12"]

[project.urls]
Homepage = "https://github.com/yasinyaman/graphlore"
Repository = "https://github.com/yasinyaman/graphlore"
Issues = "https://github.com/yasinyaman/graphlore/issues"
Documentation = "https://github.com/yasinyaman/graphlore/tree/master/docs"
Changelog = "https://github.com/yasinyaman/graphlore/blob/master/CHANGELOG.md"
"Graphify" = "https://github.com/Graphify-Labs/graphify"

[project.scripts]
# The rename from graphify-mcp freed us to claim the bare name: `graphifyy`
# ships a `graphify-mcp` script (its embedded server), which is why the old
# entry point had to be the clunky `graphify-mcp-server`. No collision now.
graphlore = "graphlore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphlore"]

# The native engine (engine/) is its own distribution, graphlore-engine, built
# with maturin; keeping it out of this sdist keeps graphlore pure Python.
[tool.hatch.build.targets.sdist]
exclude = ["/engine"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# Non-strict first baseline: type-check the package and catch real type errors
# without demanding exhaustive annotations. ignore_missing_imports covers the
# third-party deps that ship no stubs (mcp, semble, tree-sitter). The MCP tool
# signatures are fully typed — FastMCP derives each tool's JSON schema from them.
python_version = "3.10"
files = ["src/graphlore"]
ignore_missing_imports = true

# numpy's stubs use syntax newer than python_version 3.10; the dense tier only
# calls it inside functions, so treat it (and model2vec) as untyped.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "model2vec", "model2vec.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["graphlore"]

[tool.coverage.report]
show_missing = true
# main()/HTTP-transport wiring and a few defensive guards aren't exercised by the
# unit suite; 80 is a floor comfortably below the current ~87% line coverage.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
