[package]
name = "graphlore-engine"
version = "0.5.8"
edition = "2021"
rust-version = "1.90"
description = "graphlore's native code-graph extractor: tree-sitter definitions, spans and containment in 14 languages"
license = "MIT"
repository = "https://github.com/yasinyaman/graphlore"
readme = "README.md"
publish = false

[lib]
name = "graphlore_engine"
crate-type = ["cdylib", "rlib"]

[features]
# The PyO3 module. Off by default so `cargo test` / `cargo clippy` need no Python;
# maturin turns it on (engine/pyproject.toml).
python = ["dep:pyo3"]

[dependencies]
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-scala = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-md = { version = "0.5", default-features = false }
rayon = "1.10"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"], optional = true }
bincode = "1.3"

[profile.release]
lto = "thin"
codegen-units = 4
