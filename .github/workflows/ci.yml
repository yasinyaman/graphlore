name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # include the tree-sitter extra so the multi-language backend tests run
          # (they self-skip when it's absent) rather than silently no-op in CI
          pip install -e ".[dev,treesitter]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Test (pytest + coverage)
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # The native engine (engine/, the graphlore-engine wheel): Rust checks, then
  # graphlore's suite with the engine installed, so tests/test_engine.py runs
  # instead of skipping and the native span fallback is exercised.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
      - name: Format (cargo fmt)
        run: cargo fmt --manifest-path engine/Cargo.toml --check
      - name: Lint (clippy)
        run: |
          cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path engine/Cargo.toml --all-targets --features python -- -D warnings
      - name: Test (cargo test)
        run: cargo test --manifest-path engine/Cargo.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel (maturin)
        run: |
          python -m pip install --upgrade pip maturin
          maturin build -m engine/Cargo.toml --release --out dist-engine
          ls -l dist-engine
      - name: Test graphlore with the engine
        run: |
          pip install -e ".[dev,treesitter]" dist-engine/*.whl
          pytest -q
          python benchmarks/compare_engines.py tests/fixtures/polyglot \
            --graphify-graph tests/fixtures/polyglot/graph.json --fail-under 95
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: The abi3 wheel on Python 3.10
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" dist-engine/*.whl
          pytest -q tests/test_engine.py
