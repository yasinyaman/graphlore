name: Publish to PyPI

# Uploads graphlore to PyPI with Trusted Publishing (OIDC), so no API token is
# stored in the repository. One-time setup on PyPI is described under
# "Releasing" in CONTRIBUTING.md. Two ways in:
# - a published GitHub release whose tag is the pyproject version (v0.7.0);
# - run by hand (Actions -> Publish to PyPI -> Run workflow) on master: it
#   publishes the pyproject version, then creates the v<version> release. A
#   release made with GITHUB_TOKEN starts no other workflow, so this one does
#   not run twice.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::release tag $GITHUB_REF_NAME does not match pyproject version $version"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged: bump the version in pyproject.toml first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphlore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # run by hand: tag and release what was just published
    needs: [build, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "graphlore $VERSION on PyPI: https://pypi.org/project/graphlore/$VERSION/ — what changed is under [$VERSION] in https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md"
